  <!-- ═══════════════════════════════════════════════════════════════

  <style>
    /* ── Cookie Consent: Banner ───────────────────────── */
    #cc-banner {

    .cc-inner {
      max-width: 680px;
      margin: 0 auto;
      background: rgba(26,39,68,.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 24px 28px;

    .cc-title {

    .cc-desc {

    .cc-actions {

    .cc-configure {

    /* ── Cookie Consent: Settings Panel ───────────────── */
    #cc-settings {

      background: rgba(0,0,0,.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .cc-settings-panel {
      position: relative; z-index: 1;

      background: #fff;
      border-radius: 18px;
      padding: 24px 28px 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      font-family: 'DM Sans', system-ui, sans-serif;
      color: #1a2744;
      animation: ccSlideUp .35s ease-out;
    }
    .cc-settings-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .cc-settings-header .cc-title {
      color: #1a2744; margin: 0; font-size: 17px;
    }
    .cc-settings-x {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: #f0ede6; border-radius: 50%;
      font-size: 16px; color: #1a2744; cursor: pointer;
      transition: all .2s;
    }
    .cc-settings-x:hover { background: #e2ddd2; }

    .cc-category {
      border-top: 1px solid rgba(26,39,68,.08);
      padding: 16px 0;
    }
    .cc-cat-row {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    }
    .cc-cat-row strong { font-size: 14px; font-weight: 600; }
    .cc-cat-desc {
      font-size: 12.5px; line-height: 1.5; color: rgba(26,39,68,.55);
      margin: 4px 0 0;
    }
    .cc-always-on {
      flex-shrink: 0;
      font-size: 11px; font-weight: 600;
      color: #2d8da6; background: rgba(45,141,166,.1);
      padding: 4px 10px; border-radius: 6px;
      white-space: nowrap; margin-top: 2px;
    }

    /* Toggle switch */
    .cc-toggle { flex-shrink: 0; margin-top: 2px; cursor: pointer; }
    .cc-toggle input { display: none; }
    .cc-toggle-track {
      display: block; width: 44px; height: 24px;
      background: #d1cdc4; border-radius: 12px;
      position: relative; transition: background .25s;
    }
    .cc-toggle-track::after {
      content: '';
      position: absolute; left: 3px; top: 3px;
      width: 18px; height: 18px;
      background: #fff; border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      transition: transform .25s;
    }
    .cc-toggle input:checked + .cc-toggle-track {
      background: #2d8da6;
    }
    .cc-toggle input:checked + .cc-toggle-track::after {
      transform: translateX(20px);
    }

    .cc-settings-footer {
      margin-top: 8px; padding-top: 16px;
      border-top: 1px solid rgba(26,39,68,.08);
    }
    .cc-settings-footer .cc-btn {
      width: 100%; color: #1a2744;
      border-color: rgba(26,39,68,.2);
    }
    .cc-settings-footer .cc-btn:hover {
      background: rgba(26,39,68,.06);
      border-color: rgba(26,39,68,.35);
    }

    /* Mobile tweaks */
    @media (max-width: 480px) {
      .cc-inner { padding: 20px; border-radius: 14px; }
      .cc-title { font-size: 16px; }
      .cc-desc  { font-size: 12.5px; }
      .cc-actions { flex-direction: column; gap: 8px; }
      .cc-btn { padding: 13px 16px; font-size: 14px; }
      .cc-settings-panel { padding: 20px; border-radius: 14px; }
    }
  </style>

  <script>
    /* ═══════════════════════════════════════════════════
       Cookie Consent – vanilla JS (multilingual)
       GA4 Measurement ID: G-7CJ8W68XGB
       Reads locale from the same localStorage key as React i18n
       ═══════════════════════════════════════════════════ */
    (function () {
      'use strict';

      var STORAGE_KEY = 'vf_cookie_consent';
      var GA_ID = 'G-7CJ8W68XGB';

      // ── Translations ─────────────────────────────────
      var T = {
        en: {
          title:         '🍪 We use cookies',
          desc:          'We use essential cookies and third-party cookies (Google Analytics) to improve your experience. You can accept, reject or configure your preferences. ',
          policy:        'Cookie policy',
          reject:        'Reject all',
          accept:        'Accept all',
          configure:     'Configure preferences',
          settingsTitle: '⚙️ Cookie preferences',
          essential:     'Essential',
          essentialDesc: 'Required for the site to function. Cannot be disabled.',
          alwaysOn:      'Always active',
          analytics:     'Analytics (Google Analytics)',
          analyticsDesc: 'Help us understand how the site is used so we can improve it. They do not identify users.',
          save:          'Save preferences'
        },
        es: {
          title:         '🍪 Utilizamos cookies',
          desc:          'Usamos cookies propias (esenciales) y de terceros (Google Analytics) para mejorar tu experiencia. Puedes aceptar, rechazar o configurar tus preferencias. ',
          policy:        'Política de cookies',
          reject:        'Rechazar todo',
          accept:        'Aceptar todo',
          configure:     'Configurar preferencias',
          settingsTitle: '⚙️ Preferencias de cookies',
          essential:     'Esenciales',
          essentialDesc: 'Necesarias para el funcionamiento del sitio. No se pueden desactivar.',
          alwaysOn:      'Siempre activas',
          analytics:     'Analíticas (Google Analytics)',
          analyticsDesc: 'Nos ayudan a entender cómo se usa el sitio para mejorarlo. No identifican al usuario.',
          save:          'Guardar preferencias'
        },
        cs: {
          title:         '🍪 Používáme cookies',
          desc:          'Používáme nezbytné cookies a cookies třetích stran (Google Analytics) ke zlepšení vašeho zážitku. Můžete je přijmout, odmítnout nebo nastavit dle svých preferencí. ',
          policy:        'Zásady cookies',
          reject:        'Odmítnout vše',
          accept:        'Přijmout vše',
          configure:     'Nastavit předvolby',
          settingsTitle: '⚙️ Předvolby cookies',
          essential:     'Nezbytné',
          essentialDesc: 'Nutné pro fungování webu. Nelze je deaktivovat.',
          alwaysOn:      'Vždy aktivní',
          analytics:     'Analytické (Google Analytics)',
          analyticsDesc: 'Pomáhají nám pochopit, jak se web používá, abychom ho mohli vylepšit. Neidentifikují uživatele.',
          save:          'Uložit předvolby'
        }
      };

      // ── Detect language (mirrors React i18n logic) ───
      function detectLang() {
        var saved = localStorage.getItem('locale');
        if (saved === 'en' || saved === 'es' || saved === 'cs') return saved;
        var langs = navigator.languages || [navigator.language || ''];
        for (var i = 0; i < langs.length; i++) {
          var code = langs[i].toLowerCase();
          if (code.indexOf('cs') === 0) return 'cs';
          if (code.indexOf('es') === 0) return 'es';
        }
        return 'en';
      }

      // ── Apply translations to data-i18n elements ─────
      function applyLang() {
        var lang = detectLang();
        var strings = T[lang] || T.en;
        var els = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < els.length; i++) {
          var key = els[i].getAttribute('data-i18n');
          if (strings[key]) els[i].textContent = strings[key];
        }
      }

      // ── Helpers ──────────────────────────────────────
      function getConsent() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; }
      }
      function setConsent(obj) {
        obj.timestamp = new Date().toISOString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
      }

      // ── GA4 Loader (only runs once) ──────────────────
      var ga4Loaded = false;
      function loadGA4() {
        if (ga4Loaded) return;
        ga4Loaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', GA_ID, { anonymize_ip: true });
      }

      // ── GA4 Cleanup (remove cookies on rejection) ────
      function removeGA4() {
        // Remove GA cookies
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
          var name = cookies[i].split('=')[0].trim();
          if (name === '_ga' || name === '_gid' || name.indexOf('_ga_') === 0) {
            document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; domain=.' + location.hostname;
            document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;';
          }
        }
        // Remove injected GA scripts
        var scripts = document.querySelectorAll('script[src*="googletagmanager.com/gtag"]');
        for (var j = 0; j < scripts.length; j++) scripts[j].remove();
        // Disable gtag
        window['ga-disable-' + GA_ID] = true;
      }

      // ── UI Elements ──────────────────────────────────
      var banner   = document.getElementById('cc-banner');
      var settings = document.getElementById('cc-settings');
      var toggle   = document.getElementById('cc-analytics-toggle');

      function showBanner()    { banner.style.display = 'block'; }
      function hideBanner()    { banner.style.display = 'none'; }
      function showSettings()  { settings.style.display = 'flex'; }
      function hideSettings()  { settings.style.display = 'none'; }

      // Expose to window for the React Footer link
      window.vfOpenCookieSettings = function () {
        var c = getConsent();
        toggle.checked = c ? !!c.analytics : false;
        hideBanner();
        showSettings();
      };

      // ── Accept All ───────────────────────────────────
      document.getElementById('cc-accept').addEventListener('click', function () {
        setConsent({ analytics: true });
        hideBanner(); hideSettings();
        loadGA4();
      });

      // ── Reject All ───────────────────────────────────
      document.getElementById('cc-reject').addEventListener('click', function () {
        setConsent({ analytics: false });
        hideBanner(); hideSettings();
        removeGA4();
      });

      // ── Configure ────────────────────────────────────
      document.getElementById('cc-configure-open').addEventListener('click', window.vfOpenCookieSettings);

      // ── Save Granular ────────────────────────────────
      document.getElementById('cc-save').addEventListener('click', function () {
        var analytics = toggle.checked;
        setConsent({ analytics: analytics });
        hideSettings();
        if (analytics) { loadGA4(); } else { removeGA4(); }
      });

      // ── Close / Backdrop ─────────────────────────────
      document.getElementById('cc-settings-close').addEventListener('click', function () {
        hideSettings();
        // If no choice made yet, re-show banner
        if (!getConsent()) showBanner();
      });
      document.getElementById('cc-settings-backdrop').addEventListener('click', function () {
        hideSettings();
        if (!getConsent()) showBanner();
      });

      // ── Init ─────────────────────────────────────────
      applyLang();

      // Re-apply when React changes locale (it sets localStorage + document.lang)
      var _origSetItem = Storage.prototype.setItem;
      Storage.prototype.setItem = function (key, value) {
        _origSetItem.call(this, key, value);
        if (key === 'locale') applyLang();
      };

      var existing = getConsent();
      if (!existing) {
        showBanner();
      } else {
        if (existing.analytics) loadGA4();
      }
    })();
  </script>
